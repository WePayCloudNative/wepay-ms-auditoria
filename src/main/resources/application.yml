server:
  port: 8086

spring:
  application:
    name: wepay-ms-auditoria

  # 1. Base de datos Oracle (Amazon RDS en AWS).
  #    URL, usuario y clave llegan por variables de entorno; nunca se suben al repositorio.
  #    Para desarrollar sin Oracle, usar el perfil "local" (H2 en memoria).
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/XEPDB1}
    username: ${DB_USER:auditoria}
    password: ${DB_PASSWORD:}
    driver-class-name: oracle.jdbc.OracleDriver

  # 2. JPA / Hibernate: 'update' crea las tablas en el esquema del usuario si no existen
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect

  # 3. Kafka: mismo nombre de variable que ms-pedidos y ms-reportes
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: wepay-auditoria-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Spring confirma el offset recién después de procesar (ver listener.ack-mode)
      enable-auto-commit: false
      # Máximo de eventos por lectura: lotes chicos, procesados uno a uno
      max-poll-records: 50
      properties:
        # Si el consumidor deja de responder 15 s, Kafka reparte sus particiones a otro
        session.timeout.ms: 15000
        heartbeat.interval.ms: 5000
        # Tiempo máximo entre lecturas antes de considerarlo bloqueado
        max.poll.interval.ms: 300000
        # Al rebalancear, solo se mueven las particiones necesarias (sin pausar todo el grupo)
        partition.assignment.strategy: org.apache.kafka.clients.consumer.CooperativeStickyAssignor
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # --- Confiabilidad del envío ---
      # all: el broker confirma solo cuando el mensaje está en las réplicas sincronizadas
      # (min.insync.replicas=2 en el clúster de 3 brokers)
      acks: all
      retries: 5
      compression-type: lz4
      properties:
        # Idempotente: si un envío se reintenta, Kafka no guarda el mensaje dos veces
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        retry.backoff.ms: 500
        request.timeout.ms: 10000
        delivery.timeout.ms: 30000
        # Junta mensajes hasta 5 ms antes de enviar (menos viajes a la red)
        linger.ms: 5
    listener:
      # Confirma cada evento apenas se procesa: si el servicio cae, a lo más se repite uno
      # (los consumidores ignoran duplicados por eventId)
      ack-mode: record
      # 3 hilos = 1 por partición de orders.events (el orden por pedido se mantiene)
      concurrency: 3

# 4. Variables propias de la aplicación
app:
  kafka:
    topic:
      # Tópico canónico de eventos de negocio a escuchar
      orders: orders.events
      # Eventos que no se pudieron procesar después de los reintentos
      dlt: orders.events.auditoria.DLT
      # Donde se publica cada evento ya registrado (lo consume ms-pedidos)
      timeline: audit.timeline
