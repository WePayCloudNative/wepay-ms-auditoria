server:
  port: 8086

spring:
  application:
    name: wepay-ms-auditoria

  # 1. Base de datos Oracle (Amazon RDS en AWS).
  #    URL, usuario y clave llegan por variables de entorno; nunca se suben al repositorio.
  #    Para desarrollar sin Oracle, usar el perfil "local" (H2 en memoria).
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/XEPDB1}
    username: ${DB_USER:auditoria}
    password: ${DB_PASSWORD:}
    driver-class-name: oracle.jdbc.OracleDriver

  # 2. JPA / Hibernate: 'update' crea las tablas en el esquema del usuario si no existen
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect

  # 3. Kafka: mismo nombre de variable que ms-pedidos y ms-reportes
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: wepay-auditoria-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

# 4. Variables propias de la aplicación
app:
  kafka:
    topic:
      # Tópico canónico de eventos de negocio a escuchar
      orders: orders.events
      # Eventos que no se pudieron procesar después de los reintentos
      dlt: orders.events.auditoria.DLT
